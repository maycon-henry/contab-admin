# Deploy sob demanda para o Render (homologação).
# Uso: GitHub > Actions > "Deploy (Render)" > Run workflow (branch main).
# Roda Pint e Pest; só se passarem, chama o Deploy Hook do Render (secret RENDER_DEPLOY_HOOK_URL).
name: Deploy (Render)

on:
  workflow_dispatch:

concurrency:
  group: deploy-render
  cancel-in-progress: false

jobs:
  qualidade:
    name: Pint + Pest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: contab_testes
          POSTGRES_USER: contab
          POSTGRES_PASSWORD: contab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contab -d contab_testes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: contab
      DB_PASSWORD: contab

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, intl, zip, gd, bcmath, exif, soap
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          npm run build

      - name: Ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Pest
        run: ./vendor/bin/pest

  deploy:
    name: Deploy no Render
    needs: qualidade
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Deploy Hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL não configurado no repositório."
            exit 1
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Deploy solicitado ao Render. Acompanhe em https://dashboard.render.com"
