; Pool do PHP-FPM no Render. Roda como www-data (o container já inicia com esse usuário),
; então não há diretivas user/group aqui. Poucos processos: o plano gratuito tem 512 MB.
[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
