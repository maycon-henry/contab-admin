; Ambiente de DESENVOLVIMENTO: no Docker Desktop (Windows), arquivos do volume montado pertencem a root.
; Rodar o PHP-FPM como root evita erros de permissão em storage/ quando comandos artisan (executados como root)
; criam pastas. A imagem de produção deve usar um usuário sem privilégios (AGENTS.md seção 2.1).
[www]
user = root
group = root
